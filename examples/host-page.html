<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopify Host Page — 3D Configurator Embed Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f8fafc;
      color: #0f172a;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      color: #1e293b;
    }
    .badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
    }
    .embed-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      overflow: hidden;
      height: 750px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .sidebar {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      padding: 20px;
      display: flex;
      flex-col;
      gap: 16px;
    }
    .sidebar h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #1e293b;
    }
    .event-log {
      background: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      font-size: 11px;
      padding: 12px;
      border-radius: 10px;
      height: 380px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>MVP Visuals — Shopify Storefront Integration</h1>
      <p style="margin: 4px 0 0 0; color: #64748b; font-size: 13px;">
        Demonstration of <code>postMessage</code> protocol and zero-friction iframe embedding
      </p>
    </div>
    <span class="badge">Host Page (Origin: parent)</span>
  </header>

  <div class="grid">
    <!-- Embedded 3D Configurator iframe -->
    <div class="embed-card">
      <iframe
        id="configurator-iframe"
        src="/?embed=1"
        allow="fullscreen"
        title="Interactive 3D Canopy Tent Configurator"
      ></iframe>
    </div>

    <!-- Host Page Control & Real-time Event Monitor -->
    <div class="sidebar">
      <div>
        <h2>Host <-> Iframe Controls</h2>
        <div class="controls">
          <button onclick="setVariant('canopy-10x10')">Switch to 10ft x 10ft</button>
          <button onclick="setVariant('canopy-8x8')">Switch to 8ft x 8ft</button>
          <button onclick="setVariant('canopy-5x5')">Switch to 5ft x 5ft</button>
          <button class="btn-secondary" onclick="requestPreview()">Request 3D Preview</button>
        </div>
      </div>

      <div style="margin-top: 16px;">
        <h2>postMessage Event Bus Stream</h2>
        <div id="event-log" class="event-log">Waiting for configurator:ready...</div>
      </div>
    </div>
  </div>
</div>

<script>
  const iframe = document.getElementById('configurator-iframe');
  const logEl = document.getElementById('event-log');

  function log(text) {
    const time = new Date().toLocaleTimeString();
    logEl.innerText = `[${time}] ${text}\n\n` + logEl.innerText;
  }

  // 1. Listen for postMessages from the Configurator
  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || typeof data.type !== 'string' || !data.type.startsWith('configurator:')) {
      return;
    }

    log(`EVENT RECEIVED: ${data.type}\n${JSON.stringify(data.payload, null, 2)}`);

    if (data.type === 'configurator:addToCart') {
      alert(`🎉 Host received addToCart event!\nPrice authorized via token: ${data.payload.properties._price_token || 'Verified'}\nCheck console for payload.`);
      console.log('Shopify Add To Cart Payload:', data.payload);
    }
  });

  // 2. Dispatch Commands to Configurator via postMessage
  function setVariant(variantId) {
    iframe.contentWindow.postMessage({
      type: 'configurator:setVariant',
      payload: { variantId }
    }, '*');
    log(`COMMAND SENT: configurator:setVariant (${variantId})`);
  }

  function requestPreview() {
    iframe.contentWindow.postMessage({
      type: 'configurator:requestPreview',
      payload: {}
    }, '*');
    log('COMMAND SENT: configurator:requestPreview');
  }
</script>

</body>
</html>
